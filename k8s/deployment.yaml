apiVersion: v1
kind: Namespace
metadata:
  name: community-connect
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cc-config
  namespace: community-connect
data:
  NODE_ENV: "production"
  PORT: "5001"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "community_connect"
  DB_USER: "cc_user"
---
apiVersion: v1
kind: Secret
metadata:
  name: cc-secrets
  namespace: community-connect
type: Opaque
stringData:
  DB_PASSWORD: "cc_password"
  MYSQL_ROOT_PASSWORD: "rootpassword"
  JWT_SECRET: "super_secret_jwt_key_community_connect_2026_sr_university"
---
# PersistentVolumeClaim for MySQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: community-connect
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# MySQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: community-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: cc-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: cc-config
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: community-connect
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: community-connect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: community-connect-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cc-config
            - secretRef:
                name: cc-secrets
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: community-connect
spec:
  selector:
    app: backend
  ports:
    - port: 5001
      targetPort: 5001
---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: community-connect
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: community-connect-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: community-connect
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
